<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ronald | 个人主页</title>
  <meta name="description" content="Ronald 的个人主页">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #bc8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 72px 24px 32px;
      text-align: center;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--border);
      box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.12);
    }
    h1 {
      margin-top: 18px;
      font-size: 2.1rem;
      letter-spacing: 1px;
    }
    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .links { margin-top: 18px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      font-size: 0.92rem;
      transition: border-color 0.2s, transform 0.2s;
    }
    .links a:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); }

    main {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 24px 48px;
      flex: 1;
    }
    section { margin-top: 36px; }
    h2 {
      font-size: 1.25rem;
      margin-bottom: 14px;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.35);
      font-size: 0.9rem;
      color: var(--accent);
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 24px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <img class="avatar" src="https://avatars.githubusercontent.com/u/39132198?v=4" alt="Ronald">
    <h1>Ronald</h1>
    <p class="tagline">产品 · 持续学习 · 保持热爱</p>
    <nav class="links">
      <a href="https://github.com/Ronald9812" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:">邮箱</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>关于我</h2>
      <div class="card">
        <p>你好，我是 Ronald，一名产品从业者。我喜欢研究产品、体验新事物，也在不断学习如何让想法变成现实。这个主页会随着我的成长持续更新。</p>
      </div>
    </section>

    <section>
      <h2>关注领域</h2>
      <div class="card">
        <div class="skills">
          <span class="skill">产品设计</span>
          <span class="skill">用户体验</span>
          <span class="skill">数据分析</span>
          <span class="skill">效率工具</span>
          <span class="skill">AI 应用</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Ronald · Powered by GitHub Pages
  </footer>
</body>
</html>
